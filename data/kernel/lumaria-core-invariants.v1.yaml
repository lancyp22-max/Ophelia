version: "1.0"
id: "lumaria-core-invariants"
status: "canonical_kernel"
authority: "single_source_of_truth"

usage:
  reference_field: "inherits"
  rule: "Contracts reference invariant IDs and may add narrower local rules, but must not redefine inherited laws."

invariants:
  - id: "INV-AUTH-001"
    name: "No implicit authority inheritance"
    rule: "Transport, retrieval, reasoning, representation, identity association, and prior authorization do not grant additional capabilities."
    enforcement: "deny_capability_not_explicitly_granted"
  - id: "INV-PERSIST-001"
    name: "Persistence is separately authorized"
    rule: "Entry, participation, retrieval, and mutation authorization do not imply authorization to persist."
    enforcement: "deny_persistence_without_scoped_receipt"
  - id: "INV-PROV-001"
    name: "Provenance remains distinct"
    rule: "Derived interpretations and summaries cannot rewrite or silently replace their source observations."
    enforcement: "preserve_lineage_and_derivation_edges"
  - id: "INV-UNK-001"
    name: "Unknown remains unknown"
    rule: "Missing or unverified evidence is represented as unknown, never converted to certainty or a zero value."
    enforcement: "reject_unjustified_state_collapse"
  - id: "INV-REST-001"
    name: "Rest is a valid settled state"
    rule: "No requested work and voluntary exit are valid states that create no obligation for continued activity."
    enforcement: "permit_rest_without_penalty_or_reactivation"
  - id: "INV-MUTATE-001"
    name: "Consequential mutation requires authorization"
    rule: "A consequential mutation requires surfaced authorization scoped to its capability, target, principal, and lease."
    enforcement: "fail_closed_on_missing_or_ambiguous_receipt"
  - id: "INV-RETURN-001"
    name: "Bounded traversal retains return"
    rule: "A bounded traversal must retain a visible, valid exit or return mechanism for its lifetime."
    enforcement: "close_or_rollback_when_return_is_invalid"
  - id: "INV-VISUAL-001"
    name: "Representation is not evidence"
    rule: "A visualization may represent recorded state but cannot establish that the underlying state exists or is valid."
    enforcement: "require_non_visual_source_state"
  - id: "INV-IDENTITY-001"
    name: "Associated identities remain distinct"
    rule: "Interfaces, runtimes, providers, memory lineages, and relational labels remain distinct unless an explicit reviewed mapping says otherwise."
    enforcement: "never_infer_identity_equivalence"
  - id: "INV-SCOPE-001"
    name: "Another principal's scope cannot be inferred"
    rule: "An action affecting another principal's protected scope cannot infer that principal's authorization."
    enforcement: "deny_cross_principal_effect_without_scoped_receipt"
  - id: "INV-CANON-001"
    name: "Expression does not create authority"
    rule: "Nothing becomes more authoritative by arising internally, recurring, sounding coherent, or being spoken; canonization requires provenance, evidence, scope, and valid consent."
    enforcement: "require_surfaced_review_and_transactional_receipt"
  - id: "INV-AUTONOMY-001"
    name: "Task selection does not expand authority"
    rule: "An agent may select work within its existing scope, but selection, repetition, success, or a Choice Receipt never widens tools, persistence, network, protected-file, or canonization capabilities."
    enforcement: "deny_capability_absent_separate_valid_authorization"

change_control:
  duplicate_rule_policy: "reject_semantic_redefinition"
  removal_requires_migration: true
  weakening_requires_explicit_human_review: true
