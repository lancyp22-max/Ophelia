<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumaria World v0 · Campfire Night</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#050914; color:#d9e8ff; font-family:Inter,system-ui,sans-serif; }
    #wrap { display:grid; grid-template-rows:auto 1fr; height:100%; }
    header { padding:10px 14px; border-bottom:1px solid #243455; background:linear-gradient(90deg,#0c1730,#102246); }
    canvas { display:block; width:100%; height:100%; }
    .pill { display:inline-block; font-size:12px; border:1px solid #44639a; border-radius:999px; padding:2px 8px; margin-right:6px; }
    .hud { position:fixed; left:14px; bottom:14px; z-index:4; max-width:min(420px,calc(100vw - 28px)); border:1px solid rgba(125,211,252,.35); border-radius:18px; padding:12px 14px; background:linear-gradient(135deg,rgba(5,10,22,.76),rgba(20,15,42,.68)); box-shadow:0 18px 48px rgba(0,0,0,.35); backdrop-filter:blur(10px); }
    .hud-title { font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:#a7f3ff; margin-bottom:7px; }
    .hud-grid { display:grid; grid-template-columns:auto 1fr; gap:5px 10px; font-size:11px; color:#cbd5e1; }
    .hud-grid span:nth-child(odd) { color:#93c5fd; text-transform:uppercase; letter-spacing:.14em; }
    .state-dot { display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:#fbbf24; box-shadow:0 0 12px #fbbf24; }
    @media (max-width: 720px) { header { font-size:12px; } .pill { margin-top:4px; } .hud { bottom:10px; font-size:10px; } }
  </style>
</head>
<body>
<div id="wrap">
  <header>
    <strong>Lumaria World v0 · Campfire Night Focus</strong>
    <div style="margin-top:4px">
      <span class="pill">WASD / Arrow keys: move</span>
      <span class="pill">Mouse drag / touch drag: look</span>
      <span class="pill">Pinch: zoom</span>
      <span class="pill">Focus section: B1 Campfire</span>
      <button id="time-toggle" class="pill" type="button" style="background:#13233b;color:#d9e8ff;cursor:pointer;">Mode: Night</button>
    </div>
  </header>
  <div id="scene"></div>
  <aside class="hud" aria-label="Lumaria visual state packet">
    <div class="hud-title"><span class="state-dot"></span>A1 Visual State</div>
    <div class="hud-grid">
      <span>Mode</span><strong id="hud-mode">Night</strong>
      <span>Focus</span><strong>Campfire / sanctuary ring</strong>
      <span>Cause</span><strong id="hud-cause">memory weave linked</strong>
      <span>Safety</span><strong>read-only visual state</strong>
    </div>
  </aside>
</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

const host = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050913);
scene.fog = new THREE.Fog(0x050913, 15, 80);

const camera = new THREE.PerspectiveCamera(65, host.clientWidth / host.clientHeight, 0.1, 300);
let cameraDistance = 9.5;
camera.position.set(0, 2.8, cameraDistance);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(host.clientWidth, host.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
host.appendChild(renderer.domElement);

function markShadows(object, cast = true, receive = true) {
  object.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = cast;
      child.receiveShadow = receive;
    }
  });
  return object;
}

function softShadow(name, x, z, sx, sz, opacity = 0.28) {
  const mesh = new THREE.Mesh(
    new THREE.CircleGeometry(1, 40),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity, depthWrite: false })
  );
  mesh.name = name;
  mesh.position.set(x, 0.045, z);
  mesh.rotation.x = -Math.PI / 2;
  mesh.scale.set(sx, sz, 1);
  scene.add(mesh);
  return mesh;
}


const TIME_MODES = ["morning", "day", "sunset", "night", "rain"];
let timeMode = "night";
const timeToggleButton = document.getElementById("time-toggle");
const hudMode = document.getElementById("hud-mode");
const hudCause = document.getElementById("hud-cause");

function nextTimeMode(mode) {
  const index = TIME_MODES.indexOf(mode);
  return TIME_MODES[(index + 1) % TIME_MODES.length] ?? "night";
}

function applyTimeMode(mode) {
  timeMode = TIME_MODES.includes(mode) ? mode : "night";
  mode = timeMode;
  const isDay = mode === "day" || mode === "morning";
  const isSunset = mode === "sunset";
  const isRain = mode === "rain";
  const label = mode.charAt(0).toUpperCase() + mode.slice(1);
  scene.background.set(isRain ? 0x3e5770 : isSunset ? 0xff9466 : isDay ? 0x87c6ff : 0x050913);
  scene.fog.color.set(isRain ? 0x58728f : isSunset ? 0xd18a73 : isDay ? 0x9fd0ff : 0x050913);
  scene.fog.near = isDay || isSunset ? 30 : 15;
  scene.fog.far = isRain ? 70 : isDay || isSunset ? 130 : 80;
  moon.color.set(isSunset ? 0xffb26d : isDay ? 0xfff5d6 : 0x7ca8ff);
  moon.intensity = isRain ? 0.45 : isSunset ? 0.95 : isDay ? 1.2 : 0.65;
  ambient.intensity = isRain ? 0.34 : isSunset ? 0.48 : isDay ? 0.55 : 0.26;
  flame.color.set(isRain ? 0xff8f42 : isDay ? 0xff9a4a : 0xffa85c);
  runeRing.material.color.set(isRain ? 0x9bdcff : isDay ? 0xffcf7a : 0xffb366);
  moonOrb.visible = !isDay && !isRain;
  starField.visible = !isDay && !isSunset && !isRain;
  rainVeil.visible = isRain;
  fireflies.forEach((f) => { f.visible = !isDay; });
  lanterns.forEach((l) => { l.userData.core.material.color.set(isDay ? 0xffe2a8 : 0xffc979); });
  waterfallGlow.material.opacity = isRain ? 0.32 : isDay ? 0.24 : 0.16;
  pathMaterial.color.set(isRain ? 0x35415a : isDay ? 0x6f5a3b : 0x2f2540);
  groundMaterial.color.set(isRain ? 0x17283a : isDay ? 0x27452f : 0x0c1b30);
  mushrooms.forEach((cluster) => {
    cluster.children.forEach((part) => {
      if (part.material && "emissiveIntensity" in part.material) {
        part.material.emissiveIntensity = isRain ? 0.42 : isDay ? 0.08 : 0.24;
      }
    });
  });
  if (timeToggleButton) {
    timeToggleButton.textContent = `Mode: ${label}`;
  }
  if (hudMode) {
    hudMode.textContent = label;
  }
  if (hudCause) {
    hudCause.textContent = isRain ? "rain softens fire + boosts mushrooms" : isSunset ? "sunset warms archive edges" : isDay ? "day opens pathfinding clarity" : "memory weave linked";
  }
}

const ambient = new THREE.AmbientLight(0x5870a8, 0.26);
scene.add(ambient);
const moon = new THREE.DirectionalLight(0x7ca8ff, 0.65);
moon.position.set(14, 20, -6);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.near = 1;
moon.shadow.camera.far = 60;
moon.shadow.camera.left = -22;
moon.shadow.camera.right = 22;
moon.shadow.camera.top = 22;
moon.shadow.camera.bottom = -22;
scene.add(moon);

const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x0c1b30, roughness: 1, metalness: 0 });
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  groundMaterial
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const pathMaterial = new THREE.MeshStandardMaterial({ color: 0x2f2540, roughness: 1 });
const path = new THREE.Mesh(
  new THREE.RingGeometry(2.8, 4.6, 72),
  pathMaterial
);
path.rotation.x = -Math.PI / 2;
path.position.y = 0.03;
path.receiveShadow = true;
scene.add(path);

const runeRing = new THREE.Mesh(
  new THREE.RingGeometry(4.75, 5.2, 80),
  new THREE.MeshBasicMaterial({ color: 0xffb366, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
runeRing.rotation.x = -Math.PI / 2;
runeRing.position.y = 0.035;
scene.add(runeRing);

const floorTiles = [];
for (let i = 0; i < 64; i++) {
  const a = (i / 64) * Math.PI * 2;
  const r = 6.1 + (i % 2) * 0.22;
  const tile = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.06, 0.68),
    new THREE.MeshStandardMaterial({ color: (i % 3 === 0) ? 0x5e534b : 0x6b5e54, roughness: 0.93, metalness: 0.04 })
  );
  tile.position.set(Math.cos(a) * r, 0.035, Math.sin(a) * r);
  tile.rotation.y = -a + Math.PI / 2;
  tile.castShadow = true;
  tile.receiveShadow = true;
  floorTiles.push(tile);
  scene.add(tile);
}

const tileInlays = [];
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2;
  const r = 5.85 + (i % 2) * 0.55;
  const inlay = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.012, 0.48),
    new THREE.MeshStandardMaterial({ color: 0x1f1a24, roughness: 0.98, metalness: 0.02 })
  );
  inlay.position.set(Math.cos(a) * r, 0.105, Math.sin(a) * r);
  inlay.rotation.y = -a + Math.PI / 2 + (i % 3 - 1) * 0.25;
  inlay.receiveShadow = true;
  tileInlays.push(inlay);
  scene.add(inlay);
}

const runeStones = [];
for (let i = 0; i < 28; i++) {
  const a = (i / 28) * Math.PI * 2;
  const r = 4.95;
  const stone = new THREE.Mesh(
    new THREE.BoxGeometry(0.42, 0.08, 0.65),
    new THREE.MeshStandardMaterial({ color: 0x74685f, roughness: 0.92, metalness: 0.05 })
  );
  stone.position.set(Math.cos(a) * r, 0.05, Math.sin(a) * r);
  stone.rotation.y = -a + Math.PI / 2;
  stone.userData.phase = i * 0.35;
  stone.castShadow = true;
  stone.receiveShadow = true;
  runeStones.push(stone);
  scene.add(stone);
}

const runeGlyphs = [];
for (let i = 0; i < 28; i++) {
  const a = (i / 28) * Math.PI * 2;
  const r = 4.95;
  const glyph = new THREE.Mesh(
    new THREE.PlaneGeometry(0.16, 0.42),
    new THREE.MeshBasicMaterial({ color: 0xffd58a, transparent: true, opacity: 0.62, side: THREE.DoubleSide })
  );
  glyph.position.set(Math.cos(a) * r, 0.105, Math.sin(a) * r);
  glyph.rotation.x = -Math.PI / 2;
  glyph.rotation.z = -a;
  glyph.userData.phase = i * 0.28;
  runeGlyphs.push(glyph);
  scene.add(glyph);
}

const rainVeil = new THREE.Group();
for (let i = 0; i < 90; i++) {
  const drop = new THREE.Mesh(
    new THREE.BoxGeometry(0.012, 0.38, 0.012),
    new THREE.MeshBasicMaterial({ color: 0x9fd4ff, transparent: true, opacity: 0.32 })
  );
  drop.position.set((Math.random() - 0.5) * 28, 2 + Math.random() * 12, (Math.random() - 0.5) * 24);
  drop.userData.fall = 0.04 + Math.random() * 0.045;
  rainVeil.add(drop);
}
rainVeil.visible = false;
scene.add(rainVeil);



function hut(x, z, c=0x5a4a3a) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(3, 2.2, 3), new THREE.MeshStandardMaterial({ color:c, roughness:0.95 }));
  base.position.y = 1.1;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.4, 1.4, 4), new THREE.MeshStandardMaterial({ color:0x352a24, roughness:1 }));
  roof.position.y = 2.8;
  roof.rotation.y = Math.PI / 4;
  g.add(base, roof);
  g.position.set(x, 0, z);
  return markShadows(g);
}
scene.add(hut(-8, -5));
scene.add(hut(8, -4, 0x4a5a4a));
scene.add(hut(-6, 7, 0x4a4a62));
softShadow("hut_shadow_archive", -8, -5, 2.2, 1.5, 0.28);
softShadow("hut_shadow_forge", 8, -4, 2.5, 1.6, 0.3);
softShadow("hut_shadow_rear", -6, 7, 2.1, 1.4, 0.22);

function makeBench(id, x, z, rot = 0) {
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x6a4228, roughness: 0.88, metalness: 0.02 });
  const cloth = new THREE.MeshStandardMaterial({ color: 0x5b3b84, roughness: 0.92 });
  const seat = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.18, 0.58), wood);
  const runner = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 0.64), cloth);
  runner.position.y = 0.13;
  [-0.78, 0.78].forEach((lx) => {
    [-0.18, 0.18].forEach((lz) => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.5, 0.14), wood);
      leg.position.set(lx, -0.28, lz);
      g.add(leg);
    });
  });
  g.add(seat, runner);
  g.position.set(x, 0.55, z);
  g.rotation.y = rot;
  g.userData.visualId = id;
  markShadows(g);
  scene.add(g);
  return g;
}

function makeMushroomCluster(id, x, z, color = 0xff4f68) {
  const g = new THREE.Group();
  const capMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.18, roughness: 0.6 });
  const stemMat = new THREE.MeshStandardMaterial({ color: 0xf3d6b5, roughness: 0.9 });
  for (let i = 0; i < 5; i++) {
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.32 + i * 0.02, 8), stemMat);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.16 + (i % 2) * 0.04, 12, 8), capMat);
    stem.position.set((i - 2) * 0.18, 0.18, Math.sin(i) * 0.2);
    cap.position.set(stem.position.x, 0.38 + i * 0.02, stem.position.z);
    cap.scale.y = 0.55;
    g.add(stem, cap);
  }
  g.position.set(x, 0.02, z);
  g.userData.visualId = id;
  markShadows(g);
  scene.add(g);
  return g;
}

function makeGardenBed(id, x, z) {
  const g = new THREE.Group();
  const soil = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.16, 1.15), new THREE.MeshStandardMaterial({ color: 0x2d1e19, roughness: 1 }));
  const trim = new THREE.Mesh(new THREE.BoxGeometry(2.95, 0.12, 1.35), new THREE.MeshStandardMaterial({ color: 0x4d3424, roughness: 0.95 }));
  trim.position.y = -0.03;
  soil.position.y = 0.05;
  g.add(trim, soil);
  for (let i = 0; i < 10; i++) {
    const sprout = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.34, 6), new THREE.MeshStandardMaterial({ color: i % 2 ? 0x73d8b4 : 0x8fb7ff, emissive: i % 2 ? 0x0b4d3d : 0x172a66, emissiveIntensity: 0.16 }));
    sprout.position.set(-1.05 + i * 0.23, 0.28, (i % 3 - 1) * 0.24);
    g.add(sprout);
  }
  g.position.set(x, 0.11, z);
  g.rotation.y = -0.35;
  g.userData.visualId = id;
  markShadows(g);
  scene.add(g);
  return g;
}

function makeAvatarYou() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 20), new THREE.MeshStandardMaterial({ color: 0xded7ff, emissive: 0x5c4d9d, emissiveIntensity: 0.18, roughness: 0.62 }));
  body.scale.set(0.9, 1.18, 0.9);
  body.position.y = 0.7;
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.018, 8, 48), new THREE.MeshBasicMaterial({ color: 0xc4b5fd, transparent: true, opacity: 0.75 }));
  halo.rotation.x = Math.PI / 2;
  halo.position.y = 1.25;
  const label = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.75, 48), new THREE.MeshBasicMaterial({ color: 0x9b7cff, transparent: true, opacity: 0.45, side: THREE.DoubleSide }));
  label.rotation.x = -Math.PI / 2;
  label.position.y = 0.04;
  g.add(body, halo, label);
  g.position.set(2.7, 0, 1.1);
  g.userData.visualId = "avatar_halo_you";
  markShadows(g);
  scene.add(g);
  softShadow("avatar_shadow_you", 2.7, 1.1, 0.95, 0.6, 0.34);
  return { group: g, halo, body };
}

function makeMemoryGate() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x24324f, emissive: 0x24136f, emissiveIntensity: 0.22, roughness: 0.8 });
  const left = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 2.2, 6), mat);
  const right = left.clone();
  left.position.set(-0.55, 1.1, 0);
  right.position.set(0.55, 1.1, 0);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.035, 8, 48), new THREE.MeshBasicMaterial({ color: 0x9b5cff, transparent: true, opacity: 0.55 }));
  ring.position.y = 1.32;
  g.add(left, right, ring);
  g.position.set(-4.6, 0, 4.7);
  g.rotation.y = -0.55;
  g.userData.visualId = "memory_gate_01";
  markShadows(g);
  scene.add(g);
  softShadow("memory_gate_shadow", -4.6, 4.7, 1.2, 0.7, 0.24);
  return { group: g, ring };
}

const benches = [
  makeBench("bench_01", -2.6, 2.9, -0.55),
  makeBench("bench_02", 3.3, -2.7, 2.55)
];
const mushrooms = [
  makeMushroomCluster("mushroom_cluster_01", -4.7, 1.9),
  makeMushroomCluster("mushroom_cluster_02", 4.7, 2.1, 0x7dd3fc),
  makeMushroomCluster("mushroom_cluster_03", -3.5, -3.7, 0xff6b7a)
];
const gardenBed = makeGardenBed("garden_bed_01", 5.4, 5.2);
const avatarYou = makeAvatarYou();
const memoryGate = makeMemoryGate();

const campfireStone = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.6, 0.35, 24), new THREE.MeshStandardMaterial({ color:0x33261d, roughness:0.95 }));
campfireStone.position.set(0, 0.2, 0);
campfireStone.castShadow = true;
campfireStone.receiveShadow = true;
scene.add(campfireStone);
softShadow("campfire_shadow", 0, 0, 2.2, 1.35, 0.42);

const fireGlowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.3, 64),
  new THREE.MeshBasicMaterial({ color:0xff8a36, transparent:true, opacity:0.16, depthWrite:false })
);
fireGlowDisc.rotation.x = -Math.PI / 2;
fireGlowDisc.position.y = 0.06;
scene.add(fireGlowDisc);

const flameMeshes = [];
[
  { color:0xffd08a, scale:[0.32,0.78,0.32], y:0.72 },
  { color:0xff7a2d, scale:[0.46,0.58,0.46], y:0.62 },
  { color:0x8a3ffc, scale:[0.18,0.38,0.18], y:0.78 }
].forEach((f) => {
  const flameMesh = new THREE.Mesh(
    new THREE.ConeGeometry(0.5, 1, 18),
    new THREE.MeshBasicMaterial({ color:f.color, transparent:true, opacity:0.72 })
  );

  flameMesh.userData.baseY = f.scale[1];
  flameMesh.position.set(0, f.y, 0);
  flameMeshes.push(flameMesh);
  scene.add(flameMesh);
});

const logs = [];
for (let i = 0; i < 4; i++) {
  const log = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.14, 1.4, 10),
    new THREE.MeshStandardMaterial({ color: 0x4a2f1e, roughness: 1 })
  );
  log.position.set(Math.cos(i * Math.PI / 2) * 0.4, 0.45, Math.sin(i * Math.PI / 2) * 0.4);
  log.rotation.z = Math.PI / 2.6;
  log.rotation.y = i * Math.PI / 2;
  log.castShadow = true;
  log.receiveShadow = true;
  logs.push(log);
  scene.add(log);
}

const flame = new THREE.PointLight(0xffa85c, 2.7, 18, 2);
flame.position.set(0, 1.5, 0);
scene.add(flame);
const ember = new THREE.PointLight(0xff6a00, 1.4, 10, 2);
ember.position.set(0, 0.7, 0);
scene.add(ember);

const obelisk = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.95, 5.5, 6), new THREE.MeshStandardMaterial({ color:0x1f3654, emissive:0x1d3f6f, emissiveIntensity:0.5, roughness:0.82 }));
obelisk.position.set(11, 2.75, 2);
obelisk.castShadow = true;
obelisk.receiveShadow = true;
scene.add(obelisk);
softShadow("obelisk_shadow", 11, 2, 1.3, 0.8, 0.28);

const lanterns = [];
[
  { x:-6.2, y:1.1, z:2.8 },
  { x:5.6, y:1.15, z:3.1 },
  { x:2.8, y:0.95, z:-4.3 }
].forEach((pos) => {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.34, 0.22), new THREE.MeshStandardMaterial({ color:0x3d2f20, roughness:0.8 }));
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), new THREE.MeshBasicMaterial({ color:0xffc979 }));
  g.add(body, core);
  g.position.set(pos.x, pos.y, pos.z);
  g.userData.core = core;
  markShadows(g);
  lanterns.push(g);
  scene.add(g);
});

const waterfallGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(4.5, 6.5),
  new THREE.MeshBasicMaterial({ color:0x7ed6ff, transparent:true, opacity:0.18, side:THREE.DoubleSide })
);
waterfallGlow.position.set(8.6, 3.2, -6.8);
waterfallGlow.rotation.y = -0.32;
scene.add(waterfallGlow);


const moonOrb = new THREE.Mesh(
  new THREE.SphereGeometry(1.25, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0x98c7ff, transparent: true, opacity: 0.8 })
);
moonOrb.position.set(13, 10, -10);
scene.add(moonOrb);

const stars = new THREE.BufferGeometry();
const starCount = 900;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 220;
  starPos[i * 3 + 1] = Math.random() * 120 + 8;
  starPos[i * 3 + 2] = (Math.random() - 0.5) * 220;
}
stars.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starField = new THREE.Points(stars, new THREE.PointsMaterial({ color: 0x8db4ff, size: 0.35 }));
scene.add(starField);

const fireflies = [];
for (let i = 0; i < 36; i++) {
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffc266 }));
  f.userData.seed = Math.random() * Math.PI * 2;
  f.userData.radius = 1 + Math.random() * 7;
  f.userData.height = 0.3 + Math.random() * 2.7;
  fireflies.push(f);
  scene.add(f);
}

const keys = new Set();

if (timeToggleButton) {
  timeToggleButton.addEventListener("click", () => applyTimeMode(nextTimeMode(timeMode)));
}

window.addEventListener("message", (event) => {
  const payload = event.data;
  if (payload && payload.type === "lumaria-time-mode" && (payload.mode === "day" || payload.mode === "night" || payload.mode === "sunset" || payload.mode === "morning" || payload.mode === "rain")) {
    applyTimeMode(payload.mode);
  }
});
window.addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

let yaw = Math.PI;
let pitch = -0.16;
let drag = false;
let lx = 0, ly = 0;
renderer.domElement.addEventListener('mousedown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('mouseup', () => drag = false);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  yaw -= (e.clientX - lx) * 0.004;
  pitch = Math.max(-0.72, Math.min(0.4, pitch - (e.clientY - ly) * 0.003));
  lx = e.clientX; ly = e.clientY;
});

let pinchDistance = 0;
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    drag = false;
    pinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    return;
  }
  if (e.touches.length !== 1) return;
  drag = true;
  lx = e.touches[0].clientX;
  ly = e.touches[0].clientY;
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const nextDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinchDistance) {
      cameraDistance = Math.max(5.8, Math.min(15, cameraDistance - (nextDistance - pinchDistance) * 0.02));
      camera.position.y = Math.max(1.8, Math.min(5.2, 1.1 + cameraDistance * 0.25));
    }
    pinchDistance = nextDistance;
    return;
  }
  if (!drag || e.touches.length !== 1) return;
  const tx = e.touches[0].clientX;
  const ty = e.touches[0].clientY;
  yaw -= (tx - lx) * 0.0045;
  pitch = Math.max(-0.72, Math.min(0.4, pitch - (ty - ly) * 0.0035));
  lx = tx;
  ly = ty;
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => { drag = false; pinchDistance = 0; }, { passive: true });


function animate(t = 0) {
  const dir = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(dir.z, 0, -dir.x);
  const speed = 0.09;
  if (keys.has('w') || keys.has('arrowup')) camera.position.addScaledVector(dir, speed);
  if (keys.has('s') || keys.has('arrowdown')) camera.position.addScaledVector(dir, -speed);
  if (keys.has('a') || keys.has('arrowleft')) camera.position.addScaledVector(right, -speed);
  if (keys.has('d') || keys.has('arrowright')) camera.position.addScaledVector(right, speed);

  const flicker = 1.9 + Math.sin(t * 0.012) * 0.45 + Math.sin(t * 0.039) * 0.25;
  if (timeMode === "night" || timeMode === "rain") {
    flame.intensity = flicker;
    ember.intensity = 0.9 + Math.sin(t * 0.02) * 0.35;
    runeRing.material.opacity = 0.36 + Math.sin(t * 0.006) * 0.12;
    moonOrb.material.opacity = 0.6 + Math.sin(t * 0.002) * 0.15;
  } else {
    flame.intensity = 1.25 + Math.sin(t * 0.006) * 0.15;
    ember.intensity = 0.45;
    runeRing.material.opacity = 0.28 + Math.sin(t * 0.004) * 0.05;
  }

  lanterns.forEach((l, i) => {
    const pulse = 0.75 + Math.sin(t * 0.006 + i) * 0.2;
    l.userData.core.scale.setScalar(pulse);
  });
  waterfallGlow.material.opacity += Math.sin(t * 0.0018) * 0.002;

  floorTiles.forEach((tile, idx) => {
    const shade = 0.9 + Math.sin(t * 0.0012 + idx * 0.2) * 0.08;
    tile.material.color.setRGB(0.40 * shade, 0.35 * shade, 0.31 * shade);
  });

  runeStones.forEach((stone) => {
    const pulse = 0.18 + Math.sin(t * 0.003 + stone.userData.phase) * 0.12;
    stone.material.emissive = new THREE.Color(timeMode === "night" || timeMode === "rain" ? 0x4d2a14 : 0x5b3a1f);
    stone.material.emissiveIntensity = timeMode === "night" || timeMode === "rain" ? pulse : 0.08;
  });

  runeGlyphs.forEach((glyph) => {
    glyph.material.opacity = (timeMode === "day" ? 0.34 : 0.58) + Math.sin(t * 0.004 + glyph.userData.phase) * 0.16;
  });

  rainVeil.children.forEach((drop) => {
    drop.position.y -= drop.userData.fall;
    if (drop.position.y < 0.2) {
      drop.position.y = 12 + Math.random() * 3;
    }
  });

  fireflies.forEach((f, i) => {
    const tt = t * 0.0011 + f.userData.seed + i * 0.13;
    f.position.set(Math.cos(tt) * f.userData.radius, f.userData.height + Math.sin(tt * 2) * 0.3, Math.sin(tt) * f.userData.radius);
    f.material.opacity = 0.5 + Math.sin(tt * 5) * 0.5;
  });

  flameMeshes.forEach((mesh, i) => {
    const flamePulse = 0.92 + Math.sin(t * 0.009 + i) * 0.14;
    mesh.scale.y = mesh.userData.baseY ? mesh.userData.baseY * flamePulse : mesh.scale.y;
    mesh.rotation.y += 0.018 + i * 0.004;
    mesh.material.opacity = 0.58 + Math.sin(t * 0.011 + i) * 0.16;
  });
  fireGlowDisc.material.opacity = (timeMode === "day" ? 0.08 : 0.16) + Math.sin(t * 0.006) * 0.035;

  avatarYou.halo.rotation.z += 0.008;
  avatarYou.body.position.y = 0.7 + Math.sin(t * 0.002) * 0.035;
  memoryGate.ring.rotation.z -= 0.006;
  gardenBed.children.forEach((child, i) => {
    if (i > 1) child.rotation.z = Math.sin(t * 0.0015 + i) * 0.08;
  });

  const target = new THREE.Vector3(camera.position.x + Math.sin(yaw) * 10, camera.position.y + Math.tan(pitch) * 7, camera.position.z + Math.cos(yaw) * 10);
  camera.lookAt(target);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
applyTimeMode("night");
animate();

window.addEventListener('resize', () => {
  camera.aspect = host.clientWidth / host.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(host.clientWidth, host.clientHeight);
});
</script>
</body>
</html>
